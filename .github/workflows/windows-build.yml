name: Build AnimeTune for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'installer/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path 'build' -Filter 'AnimeTune.vst3' -Directory -Recurse |
            Where-Object { $_.FullName -match 'Release' } |
            Select-Object -First 1
          if (-not $plugin) {
            Write-Error 'AnimeTune.vst3 bundle was not found after build.'
            Get-ChildItem build -Recurse | Select-Object -ExpandProperty FullName
            exit 1
          }
          "VST3_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found VST3 bundle: $($plugin.FullName)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler ISCC.exe not found.' }
          & $iscc "/DPluginSource=$env:VST3_PATH" 'installer\AnimeTune.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable VST3 ZIP
        shell: pwsh
        run: Compress-Archive -Path "$env:VST3_PATH" -DestinationPath 'AnimeTune-VST3-Windows-x64.zip' -Force

      - name: Upload installer and plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTune-Windows-x64
          path: |
            dist/AnimeTune-Installer.exe
            AnimeTune-VST3-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
